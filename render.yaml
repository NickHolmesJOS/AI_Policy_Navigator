services:
  - type: web
    name: ai-policy-navigator
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: HOSTNAME=0.0.0.0 PORT=10000 node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
